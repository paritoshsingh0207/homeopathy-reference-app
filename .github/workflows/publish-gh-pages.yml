name: Publish audited v3 snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download audited Unified v3 PWA snapshot
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output app.zip 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-0d88-8211-a9de-8526e1e7746c/raw?se=2026-08-15T16%3A41%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=91dc1658-6834-54db-947b-c3741c7c6a31&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-15T02%3A53%3A12Z&ske=2026-08-16T02%3A53%3A12Z&sks=b&skv=2026-02-06&sig=%2BmyW5tqhceUq2Pch2XSuMK8WEtRQ6H6YdDXME61HLoI%3D'
          mkdir site
          unzip -q app.zip -d site

      - name: Validate deployment snapshot
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/data/v3/manifest.json
          test -s site/safety/rules_v3.json
          test -s site/manifest.webmanifest
          test -s site/sw.js
          printf 'User-agent: *\nAllow: /\n' > site/robots.txt
          touch site/.nojekyll
          du -sh site

      - name: Publish compiled app to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd site
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b gh-pages
          git add -A
          git commit -m 'deploy: audited Unified v3 PWA'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin gh-pages
