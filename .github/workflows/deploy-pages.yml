name: Deploy Homeopathy Reference App to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited deployment snapshot
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Validate audited v3 snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s data/v3/manifest.json
          test -s data/v3/indexes/search_audit.json
          test -s safety/rules_v3.json
          python - <<'PY'
          import json
          with open('data/v3/manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          with open('data/v3/indexes/search_audit.json', encoding='utf-8') as f:
              a = json.load(f)
          assert m.get('version') == 'v3', m.get('version')
          assert m.get('medicines') == 683, m.get('medicines')
          assert m.get('symptomChapters') == 38, m.get('symptomChapters')
          assert a.get('unresolvedRubricMentions') == 30481, a.get('unresolvedRubricMentions')
          assert a.get('postingTruncation') is False, a.get('postingTruncation')
          assert a.get('medicineSymptomEvidence') == a.get('indexedMedicineSymptomEvidence')
          print('Validated OCR-repaired Unified v3 snapshot:', m.get('medicines'), 'medicines,', m.get('symptomChapters'), 'chapters,', a.get('unresolvedRubricMentions'), 'unresolved mentions,', a.get('indexedMedicineSymptomEvidence'), 'indexed symptom-evidence rows')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
