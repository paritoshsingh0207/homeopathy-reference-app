name: Deploy Homeopathy Reference App to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited deployment snapshot
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Validate audited v3 snapshot and repertory workspace
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s repertory.html
          test -s source-review.html
          test -s review/source_extraction_review.json
          test -s data/v3/manifest.json
          test -s data/v3/indexes/search_audit.json
          test -s data/v3/indexes/symptom_terms.json
          test -s data/v3/indexes/symptom_chapters.json
          test -s safety/rules_v3.json
          grep -q 'Repertory workspace' index.html
          grep -q 'Historical Repertory Workspace' repertory.html
          python - <<'PY'
          import json
          with open('data/v3/manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          with open('data/v3/indexes/search_audit.json', encoding='utf-8') as f:
              a = json.load(f)
          with open('review/source_extraction_review.json', encoding='utf-8') as f:
              r = json.load(f)
          with open('data/v3/indexes/symptom_chapters.json', encoding='utf-8') as f:
              c = json.load(f)
          assert m.get('version') == 'v3', m.get('version')
          assert m.get('medicines') == 683, m.get('medicines')
          assert m.get('symptomChapters') == 38, m.get('symptomChapters')
          assert len(c.get('chapters', [])) == 38, len(c.get('chapters', []))
          assert a.get('symptomConcepts') == 60393, a.get('symptomConcepts')
          assert a.get('unresolvedRubricMentions') == 30481, a.get('unresolvedRubricMentions')
          assert a.get('postingTruncation') is False, a.get('postingTruncation')
          assert a.get('medicineSymptomEvidence') == a.get('indexedMedicineSymptomEvidence')
          assert r.get('summary', {}).get('productionMedicines') == m.get('medicines')
          assert r.get('summary', {}).get('completeSourceMedicineMappings') == 2181
          assert r.get('summary', {}).get('doubtfulRecords') == 2432
          assert r.get('summary', {}).get('notUnderstoodRecords') == 8760
          assert r.get('summary', {}).get('excludedRecords') == 260
          print('Validated deployed repertory snapshot:', a.get('symptomConcepts'), 'rubrics,', m.get('medicines'), 'medicines,', len(c.get('chapters', [])), 'chapters')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
